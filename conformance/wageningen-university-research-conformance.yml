standards:

- id: oai-pmh
  conforms: true
  operator: institution
  evidence: >-
    https://library.wur.nl/oai serves a complete, protocol-conformant OAI-PMH 2.0 interface with no
    token. verb=Identify (HTTP 200) returns protocolVersion 2.0, repositoryName "Wageningen
    University & Research Publications", repositoryIdentifier library.wur.nl, granularity YYYY-MM-DD,
    deletedRecord transient, earliestDatestamp 2013-01-02 and adminEmail
    servicedesk.facilities@wur.nl. verb=ListMetadataFormats returns four prefixes; verb=ListSets
    returns eight sets; verb=ListIdentifiers pages with resumptionToken "200:::oai_dc::"; verb=GetRecord
    returns a single record. Error handling is protocol-correct: verb=Bogus returns a 200 envelope
    with code badVerb, and an unknown prefix returns code cannotDisseminateFormat. Host is under
    WUR's own registrable domain and the surface is generated by WUR's own WURLIB6 software.
  location: openapi/wageningen-university-research-library-oai-pmh-openapi.yml
  examples:
  - examples/wageningen-university-research-oai-identify-example.xml
  - examples/wageningen-university-research-oai-listsets-example.xml

- id: datacite
  conforms: true
  operator: institution
  evidence: >-
    The oai_openaire metadata format served from https://library.wur.nl/oai carries DataCite
    Metadata Schema kernel-4 as its payload — xmlns:datacite="http://datacite.org/schema/kernel-4"
    with datacite:titles, datacite:creators, datacite:creator/datacite:creatorName[@nameType],
    datacite:nameIdentifier and datacite:rights[@rightsURI] using COAR access-right URIs
    (c_abf2 open access, c_f1cf embargoed access). Probed
    verb=ListRecords&metadataPrefix=oai_openaire&set=openaire, HTTP 200, 1,506,746 bytes,
    200 records on the first page.
  location: https://library.wur.nl/oai?verb=ListRecords&metadataPrefix=oai_openaire&set=openaire

- id: orcid
  conforms: partial
  operator: institution
  evidence: >-
    ORCID iDs are emitted as datacite:nameIdentifier with nameIdentifierScheme="ORCID" and
    schemeURI="http://orcid.org" (e.g. 0000-0003-4871-7206) in the oai_openaire records. Partial,
    and measured rather than asserted: on the first 200-record page 235 of 1,439 creator elements
    carried an ORCID (~16%); the rest carry ISNI, DAI (Dutch author identifier) or no identifier at
    all. There is no ORCID-specific endpoint of WUR's own.
  location: https://library.wur.nl/oai?verb=ListRecords&metadataPrefix=oai_openaire&set=openaire

- id: saml
  conforms: true
  operator: institution
  evidence: >-
    WUR runs two SAML 2.0 identity-provider entities registered in SURFconext, the Dutch R&E
    federation that feeds eduGAIN. Fetched https://metadata.surfconext.nl/idps-metadata.xml
    (HTTP 200, application/samlmetadata+xml, 1,032,474 bytes, 205 entities) and found
    entityID "http://login.wur.nl/adfs/services/trust" (OrganizationDisplayName "Wageningen
    University & Research (ADFS)") and entityID
    "https://sts.windows.net/27d137e5-761f-4dc1-af88-d26430abb18f/" (OrganizationDisplayName
    "Wageningen University & Research (WUR)"), both with shibmd:Scope wur.nl and wurnet.nl and
    OrganizationURL http://www.wur.nl/. Institution-operated by definition — the federation
    publishes the metadata, WUR operates the IdP behind it.
  location: https://metadata.surfconext.nl/idps-metadata.xml

- id: shibboleth
  conforms: false
  evidence: >-
    No Shibboleth IdP. The two WUR entities in the SURFconext metadata are Microsoft ADFS
    (login.wur.nl/adfs/services/trust) and Microsoft Entra ID (sts.windows.net/27d137e5-...).
    idp.wur.nl and sso.wur.nl do not resolve in DNS. The shibmd:Scope extension present on those
    entries is a federation-metadata convention, not evidence of Shibboleth software, and is not
    counted as a hit.
  location: https://metadata.surfconext.nl/idps-metadata.xml

- id: crossref
  conforms: false
  evidence: >-
    No WUR-operated Crossref surface. Publisher DOIs appear inside repository metadata records
    (one doi.org/10.10.. reference on the sampled page) but WUR registers no DOIs of its own through
    a Crossref endpoint it operates; its research data DOIs are minted by 4TU.ResearchData and DANS,
    which are separate organisations with their own catalog entries.

- id: scim
  conforms: false
  evidence: >-
    No SCIM 2.0 provisioning endpoint is publicly exposed. api.wur.nl resolves (137.224.9.86) but
    both :443 and :80 time out from the public internet, and no /scim/v2 route exists on any
    reachable WUR host.

- id: lti
  conforms: false
  evidence: >-
    No LTI tool/platform registration surface is public. WUR's VLE is Brightspace (D2L), a vendor
    platform; any LTI conformance there is D2L's, not WUR's, and is not creditable to the institution.

- id: oneroster
  conforms: false
  evidence: No OneRoster endpoint found. Student administration runs on Osiris at osiris.wur.nl, which returns HTTP 403/404 to anonymous requests and exposes no roster API.

- id: ed-fi
  conforms: false
  evidence: Ed-Fi is a US K-12/state-agency data standard with no Dutch higher-education deployment; no endpoint found and none expected.

- id: caliper
  conforms: false
  evidence: No IMS Caliper analytics endpoint found on any public WUR host.

- id: qti
  conforms: false
  evidence: No QTI assessment surface is public; assessment runs inside the Brightspace tenancy.

# --- standards outside the education regime, recorded for completeness ---

- id: openapi-3.2
  conforms: true
  operator: institution
  evidence: >-
    Six OpenAPI 3.2.0 documents in openapi/, all describing hosts under wur.nl. Five are per-tag
    splits of the AgroDataCube v2 contract (34 operations across Altitude, KPI, Raster, Retrieve,
    Return) and one describes the library OAI-PMH endpoint. Note the provenance honestly: these
    documents are ours, derived from WUR's published Postman collections and from live probes —
    WUR itself publishes no OpenAPI.
  location: openapi/

- id: ogc-wms
  conforms: true
  operator: institution
  evidence: >-
    Wageningen Marine Research runs a GeoServer at https://opengeodata.wmr.wur.nl/geoserver (portal
    page HTTP 200, 6,126 bytes) and states in its own words that it publishes OpenData "middels de
    webservices Web Mapping Service (WMS) en Web Feature Service (WFS)". Partial only in reach:
    /geoserver/ows?service=WMS&request=GetCapabilities answers HTTP 200 with an OGC ExceptionReport
    "No workspace specified", so the global capabilities document is disabled and per-workspace
    capabilities are not anonymously enumerable. The service is live; its catalogue is not indexable
    without a workspace name.
  location: https://opengeodata.wmr.wur.nl/

- id: ogc-wfs
  conforms: true
  operator: institution
  evidence: >-
    Same GeoServer instance and the same limitation as ogc-wms —
    /geoserver/ows?service=WFS&version=2.0.0&request=GetCapabilities returns HTTP 200 with the OGC
    "No workspace specified" ExceptionReport.
  location: https://opengeodata.wmr.wur.nl/

