docs: https://www.wur.nl/
note: >-
  Conformance for Wageningen University & Research, scored against the Kin Score `education`
  regulatory regime. Reward-only: an absent standard is recorded as `false` with the probe that
  looked for it, never inferred and never invented. Every `true` below points at a URL that was
