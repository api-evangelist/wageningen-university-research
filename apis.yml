aid: wageningen-university-research
name: Wageningen University & Research
x-type: university
x-category: Public Research University
description: >-
  Wageningen University & Research (WUR) is the Dutch public research university and research
  foundation for healthy food and the living environment, in Wageningen, Netherlands, and ranked
  #100 in the QS World University Rankings 2025. Its programmable footprint is real but small, and
  it sits in the research institutes rather than in a central developer platform: AgroDataCube, run
  by Wageningen Environmental Research at agrodatacube.wur.nl, is a token-gated REST API over an
  open agri-food data collection for the Netherlands; the WFBR API Portal, run by Wageningen Food &
  Biobased Research on its own Azure API Management instance, publishes a Food API behind
  registration and WUR's own terms of use; the university library operates a complete, keyless
  OAI-PMH 2.0 endpoint at library.wur.nl/oai over "Wageningen University & Research Publications",
  serving Dublin Core, MODS, DIDL and OpenAIRE/DataCite metadata; and Wageningen Marine Research
  runs an OGC WMS/WFS GeoServer at opengeodata.wmr.wur.nl. WUR also operates two SAML identity
  providers registered in SURFconext and therefore eduGAIN. What WUR does not have is a central API
  programme: there is no institution-wide developer portal, no course-catalog or registrar API
  (api.wur.nl and ssc.wur.nl resolve but time out from the public internet), and no published
  OpenAPI of its own — every OpenAPI in this repository is ours, derived from WUR's Postman
  collections and from live probes. The Research Portal at research.wur.nl is an Elsevier Pure
  tenancy: WUR's data and DOIs, Elsevier's contract, and it is recorded here as a tenant
  relationship rather than credited to WUR as engineering.
