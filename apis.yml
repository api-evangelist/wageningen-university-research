- aid: wageningen-university-research:wageningen-research-portal-pure
  name: WUR Research Portal (Elsevier Pure tenancy)
  x-operator: tenant
  x-operator-evidence: >-
    research.wur.nl is WUR's institutional research-information portal, and it is an Elsevier Pure
    deployment — the served page identifies Pure and Elsevier in its own markup and footer. The
    research outputs, persons and DOIs are WUR's; the contract, the data model and the /ws/api
    surface are Elsevier's product. Recorded here as a relationship, deliberately without a stored
    contract: no Pure spec is saved under this institution's slug. The public Pure web services are
    not exposed — https://research.wur.nl/ws/api redirects to /error/ (HTTP 404) and
    https://research.wur.nl/ws/oai?verb=Identify returns HTTP 500.
  description: >-
    Institutional research portal and CRIS for WUR publications, projects, datasets and researcher
    profiles, running on Elsevier Pure. Listed as a tenant surface because it is a genuine WUR
    institutional programmable surface, but the API contract behind it belongs to Elsevier and is
    scored against Elsevier, not against WUR. WUR's own machine-readable route into the same
    scholarly record is the library OAI-PMH endpoint listed above.
  humanURL: https://research.wur.nl/
