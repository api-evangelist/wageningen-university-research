x-coverage:
  state: covered
  reason: covered
  detail: >-
    Four institution-operated machine-readable surfaces were found and probed live, which is more
    than most universities in this cohort have: AgroDataCube v2 (agrodatacube.wur.nl, token-gated,
    routes answer 403 "No token supplied" rather than 404), the WFBR Food API on WUR's own Azure API
    Management instance (registration-gated; the portal catalogue is an SPA and the management API
    answers 401, so the contract itself is not readable), the library OAI-PMH 2.0 endpoint at
    library.wur.nl/oai (fully open, all six verbs verified), and the Wageningen Marine Research
    GeoServer at opengeodata.wmr.wur.nl (WMS/WFS live; global GetCapabilities disabled, so the layer
    catalogue is not anonymously enumerable). Two SAML IdP entities in SURFconext/eduGAIN add an
    identity-federation surface. The profile is thin in one specific way and it is worth naming: WUR
    publishes no OpenAPI, no central developer portal and no registrar/course-catalog API —
    api.wur.nl (137.224.9.86) and ssc.wur.nl (137.224.205.63) both resolve in DNS but time out on
    :80 and :443 from the public internet, and osiris.wur.nl answers 403. The AgroDataCube v1 base
    is retired (HTTP 404), which is why the five AgroDataCube contracts in this repo were re-based
    onto v2 in this run.
