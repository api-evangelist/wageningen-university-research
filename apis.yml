---
aid: wageningen-university-research
name: Wageningen University & Research
description: >-
  Wageningen University & Research (WUR) is a Dutch university and research
  institution based in Wageningen, Netherlands, specializing in the domain of
  healthy food and living environment, and ranked #100 in the QS World
  University Rankings 2025. Its public developer footprint centers on the
  agri-food research domain rather than a single central API platform: the
  AgroDataCube provides a token-based REST API over a large open data
  collection for agri-food applications, and Wageningen Food & Biobased
  Research (WFBR) operates an Azure API Management developer portal publishing
  a Food API for scientific data about food products. WUR also runs a
  Pure-powered Research Portal (research.wur.nl) and a public Data Portal,
  though documented public web-service/OAI endpoints there were not openly
  reachable at review time.
