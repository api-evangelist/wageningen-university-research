  - date: '2026-06-03'
    rating: 3
    summary: >-
      Verified a real, domain-focused agri-food API footprint. AgroDataCube
      (agrodatacube.wur.nl) is a live token-based REST API with public Postman
      docs for v2 and legacy v1, plus a working registration form. Wageningen
      Food & Biobased Research operates a live Azure API Management developer
      portal publishing a Food API. The Pure-powered Research Portal
      (research.wur.nl) and the institutional eDepot resolve, but their
      web-service/OAI-PMH endpoints returned HTTP 500/400 and are not openly
      usable, so no Pure/OAI API was cataloged. No central institution-wide
      API platform exists; counts reflect only confirmed live properties with
      no fabricated endpoints.
