  - date: '2026-08-30'
    rating: 4
    summary: >-
      University-pipeline re-profile. Operator attribution settled first: no vendor contract is
      stored under this slug, and the Elsevier Pure Research Portal is now recorded as a tenant
      relationship rather than as WUR engineering. Two corrections and one find. Correction one is
      ours: refine-openapis had welded all five AgroDataCube per-tag splits onto the wrong parent —
      they wore the title "AgroDataCube API v1 (legacy)" and base /api/v1/rest while their
      operations come from AgroDataCube v2 — and the v1 base is retired, so every one of the 34
      operations was documented against a host that answers HTTP 404. All five specs, and the ten
      derived collections, were re-based on v2. Correction two: /sources/{resource_name} does not
      exist on v2 (404) and /ahn is tagged Altitude there, so both were dropped from the v2 contract;
      both survive in openapi/_original/. The find is a complete, keyless, protocol-conformant
      OAI-PMH 2.0 endpoint at library.wur.nl/oai over "Wageningen University & Research
      Publications" — WUR's own host, WUR's own WURLIB6 software, four metadata formats and eight
      sets — which had never been catalogued. Two SAML IdP entities in SURFconext/eduGAIN and a WMR
      OGC WMS/WFS GeoServer were also confirmed. There is still no central developer portal and no
      registrar API: api.wur.nl and ssc.wur.nl resolve but time out from the public internet.
    endpoints:
      - url: https://library.wur.nl/oai?verb=Identify
        status: 200
        note: >-
